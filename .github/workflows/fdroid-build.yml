name: F-Droid release build

on:
  pull_request:
  push:
    branches:
      - surfer
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fdroiddata-recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source and release metadata
        run: ci/verify-metadata.sh

      - name: Run F-Droid metadata, scanner, and production build tests
        run: fdroid/run-fdroiddata-tests.sh

      - name: Retain production-like F-Droid artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: algebraic-variety-explorer-fdroiddata
          path: build/fdroiddata/
          if-no-files-found: warn
          retention-days: 14
