name: Explorer checked Idric formula path
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install JDK 17 only for the original reference and independent DEX tools
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: ce520edf01623cd66a7f02789018e608ecdc7068
          path: .tools/android-NDK
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared Grease bootstrap
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
        run: sh .tools/catfood/build-tools.sh
      - name: Install ripgrep required by source and artifact qualification
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update; sudo apt-get install -y --no-install-recommends ripgrep; rg --version'
      - name: Expose the declared shell for nested original-reference helpers
        run: .tools/runtime/.build/grease/bin/grease -c 'var workspace = ENV.GITHUB_WORKSPACE; var github_path = ENV.GITHUB_PATH; write -- "$workspace/.tools/runtime/.build/grease/bin" >> "$github_path"'
      - name: Qualify the pinned ICK host compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - name: Recover the qualified compiler cache identity
        id: qualified_ick_cache
        run: .tools/runtime/.build/grease/bin/grease .tools/android-NDK/dex/idric/qualified-compiler-cache.grease "$RUNNER_TEMP/ick-host-build/host-runtime-key-input.tsv" "$GITHUB_OUTPUT"
      - name: Preserve the qualified compiler before consumer checks
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ick-host-stage
          key: ick-host-v1-${{ runner.os }}-${{ runner.arch }}-fbe86e23d55cfec2000c08e61deea2a407fd7175-${{ steps.qualified_ick_cache.outputs.runtime_key }}
      - name: Restore the exact frontend bootstrap
        id: frontend
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Build the checked frontend through ICK
        if: steps.frontend.outputs.cache-hit != 'true'
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Preserve the exact frontend before consumer checks
        if: steps.frontend.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Restore exact original-reference dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: reference_dependencies
        with:
          key: ave-original-reference-jars-v1-${{ hashFiles('dependencies.lock') }}
          path: .dependencies
      - name: Acquire and verify exact original-reference dependencies
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/polynomial-qualification/prepare-dependencies.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/formula-reference-dependencies"
      - name: Preserve verified dependencies before later compiler or target failures
        if: steps.reference_dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ave-original-reference-jars-v1-${{ hashFiles('dependencies.lock') }}
          path: .dependencies
      - name: Restore source metadata and install the compiler API
        run: .tools/runtime/.build/grease/bin/grease .tools/android-NDK/dex/idric/install-frontend.grease "$GITHUB_WORKSPACE/.tools/Idric"
      - name: Build the current direct DEX driver and independent decoders
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/formula-frontend/prepare.grease "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-oracles"
      - name: Retain the exact host compiler and driver for diagnostic replay
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/formula-frontend/retain-compiler.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/formula-compiler" "$RUNNER_TEMP/ick-host-stage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-formula-compiler-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/formula-compiler/compiler.tar.gz
            ${{ runner.temp }}/formula-compiler/grease-runtime.tar.gz
            ${{ runner.temp }}/formula-compiler/*.sha256
            ${{ runner.temp }}/formula-compiler/sources.tsv
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-qualified-ick-${{ github.event.pull_request.head.sha || github.sha }}-part-00
          path: ${{ runner.temp }}/formula-compiler/ick-host-stage.part-00
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-qualified-ick-${{ github.event.pull_request.head.sha || github.sha }}-part-01
          path: ${{ runner.temp }}/formula-compiler/ick-host-stage.part-01
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-qualified-ick-${{ github.event.pull_request.head.sha || github.sha }}-part-02
          path: ${{ runner.temp }}/formula-compiler/ick-host-stage.part-02
          if-no-files-found: ignore
      - name: Compile and observe the actual Explorer Idric source
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/formula-frontend/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-evidence" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Retain exact independent decoders for installed qualification
        run: |
          .tools/runtime/.build/grease/bin/grease -c '
            var temporary = ENV.RUNNER_TEMP
            mkdir -p "$temporary/formula-evidence/oracles"
            cp "$temporary/formula-oracles/smali.jar" "$temporary/formula-oracles/baksmali.jar" "$temporary/formula-evidence/oracles/"
          '
      - name: Compile and decode the actual scalar coefficient producer
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/coefficient-values/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-evidence/coefficient-values" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Compile original-order formula preparation and derivatives
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/semantic-preparation/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-evidence/semantic-preparation" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Compile the actual ordered polynomial producer and source mutations
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/ordered-expansion/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-evidence/ordered-expansion" "$RUNNER_TEMP/formula-oracles/baksmali.jar" "$RUNNER_TEMP/formula-oracles/smali.jar"
      - name: Compile actual formula-to-native transfer and source mutations
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/prepared-transfer/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-evidence/prepared-transfer" "$RUNNER_TEMP/formula-oracles/baksmali.jar" "$RUNNER_TEMP/formula-oracles/smali.jar"
      - name: Compile actual native-pixel Bitmap source and quality mutations
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/render-pixels/verify-source.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK/dex/idric/build/exec/idric-dex" "$RUNNER_TEMP/formula-evidence/render-pixels" "$RUNNER_TEMP/formula-oracles/baksmali.jar" "$RUNNER_TEMP/formula-oracles/smali.jar"
      - name: Compile actual session epoch Bitmap source and currentness mutations
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/render-session/verify-source.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK/dex/idric/build/exec/idric-dex" "$RUNNER_TEMP/formula-evidence/render-session" "$RUNNER_TEMP/formula-oracles/baksmali.jar" "$RUNNER_TEMP/formula-oracles/smali.jar"
      - name: Compile the complete normal Activity from checked source
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/normal-activity-port/emit.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric/_" "$GITHUB_WORKSPACE/.tools/android-NDK/dex/idric/build/exec/idric-dex_app/idric-dex.so" "$GITHUB_WORKSPACE/.tools/android-NDK/dex/idric/build/ttc" "$RUNNER_TEMP/formula-oracles/baksmali.jar" "$RUNNER_TEMP/formula-oracles/smali.jar" "$RUNNER_TEMP/formula-evidence/normal-activity"
      - name: Qualify actual located formula tokens errors and semantic preparation
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/spanned-formula/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric/_" "$GITHUB_WORKSPACE/.tools/android-NDK/dex/idric/build/exec/idric-dex_app/idric-dex.so" "$GITHUB_WORKSPACE/.tools/android-NDK/dex/idric/build/ttc" "$RUNNER_TEMP/formula-oracles/smali.jar" "$RUNNER_TEMP/formula-oracles/baksmali.jar" "$RUNNER_TEMP/formula-evidence/spanned-formula"
      - name: Compare semantic admission with the retained original jsurf
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/polynomial-qualification/reference.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/formula-evidence/original-jsurf"
      - name: Install the pinned SDK and native receiver inputs
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1 ndk;29.0.14206865'
      - name: Package only the retained original jsurf as a reference oracle
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/coefficient-values/prepare-oracle.grease "$RUNNER_TEMP/formula-evidence/original-jsurf" "$ANDROID_HOME" "$RUNNER_TEMP/formula-evidence/coefficient-values/original-oracle" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Compile the application copied-surface receiver with qualified ICK
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/copied-prepared-surface/verify-jni.grease "$GITHUB_WORKSPACE" "${{ steps.ick.outputs.compiler }}" "$ANDROID_HOME/ndk/29.0.14206865" "$RUNNER_TEMP/formula-evidence/copied-receiver" "$RUNNER_TEMP/formula-oracles/smali.jar" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Compile session ownership and its locked JNI pixel publisher with ICK
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/render-session/verify-jni.grease "$GITHUB_WORKSPACE" "${{ steps.ick.outputs.compiler }}" "$ANDROID_HOME/ndk/29.0.14206865" "$RUNNER_TEMP/formula-evidence/session-receiver" "$RUNNER_TEMP/formula-oracles/smali.jar" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Assemble only the independent observation runner
        run: java -jar "$RUNNER_TEMP/formula-oracles/smali.jar" assemble examples/autogenerated/formula-frontend/FormulaRunner.smali examples/autogenerated/polynomial-qualification/PolynomialQualificationRunner.smali -o "$RUNNER_TEMP/formula-runner.dex"
      - name: Assemble the separate coefficient and original-oracle observers
        run: java -jar "$RUNNER_TEMP/formula-oracles/smali.jar" assemble examples/autogenerated/coefficient-values/CoefficientRunner.smali examples/autogenerated/coefficient-values/OriginalCoefficientOracle.smali -o "$RUNNER_TEMP/coefficient-runner.dex"
      - name: Assemble preparation observers without candidate semantics
        run: java -jar "$RUNNER_TEMP/formula-oracles/smali.jar" assemble examples/autogenerated/semantic-preparation/PreparationRunner.smali examples/autogenerated/semantic-preparation/OriginalPreparationOracle.smali -o "$RUNNER_TEMP/preparation-runner.dex"
      - name: Permit emulator hardware acceleration
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - name: Execute the actual parser, qualifier and coefficients on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1536 -gpu swiftshader_indirect
          script: |
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/formula-frontend/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence" "$RUNNER_TEMP/formula-runner.dex"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/coefficient-values/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/coefficient-values" "$RUNNER_TEMP/coefficient-runner.dex" "$RUNNER_TEMP/formula-evidence/coefficient-values/original-oracle/dex/classes.dex"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/semantic-preparation/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/semantic-preparation" "$RUNNER_TEMP/preparation-runner.dex" "$RUNNER_TEMP/formula-evidence/coefficient-values/original-oracle/dex/classes.dex"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/ordered-expansion/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/ordered-expansion" "$RUNNER_TEMP/formula-evidence/coefficient-values/original-oracle/dex/classes.dex"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/copied-prepared-surface/observe-jni.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/copied-receiver"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/prepared-transfer/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/prepared-transfer" "$RUNNER_TEMP/formula-evidence/copied-receiver" "$RUNNER_TEMP/formula-evidence/coefficient-values/original-oracle/dex/classes.dex"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/render-pixels/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/render-pixels" "$RUNNER_TEMP/formula-evidence/copied-receiver"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/render-session/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/render-session" "$RUNNER_TEMP/formula-evidence/session-receiver"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/spanned-formula/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/spanned-formula"
      - name: Retain source, diagnostics, exact DEX and actual observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-formula-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/formula-evidence
            ${{ runner.temp }}/formula-reference-dependencies
          if-no-files-found: warn
