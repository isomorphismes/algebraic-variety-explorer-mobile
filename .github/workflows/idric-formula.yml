name: Explorer checked Idric formula path
on:
  pull_request:
    paths:
      - 'c-lua/idric/**'
      - 'examples/autogenerated/formula-frontend/**'
      - 'examples/autogenerated/polynomial-qualification/**'
      - 'examples/autogenerated/coefficient-values/**'
      - 'examples/autogenerated/semantic-preparation/**'
      - '.github/workflows/idric-formula.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 682515f1c90c77b509940f90a696965d6139b5bd
          path: .tools/android-NDK
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared Grease bootstrap
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
        run: sh .tools/catfood/build-tools.sh
      - name: Install ripgrep required by source and artifact qualification
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update; sudo apt-get install -y --no-install-recommends ripgrep; rg --version'
      - name: Qualify the pinned ICK host compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - name: Recover the qualified compiler cache identity
        id: qualified_ick_cache
        run: .tools/runtime/.build/grease/bin/grease .tools/android-NDK/dex/idric/qualified-compiler-cache.grease "$RUNNER_TEMP/ick-host-build/host-runtime-key-input.tsv" "$GITHUB_OUTPUT"
      - name: Preserve the qualified compiler before consumer checks
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ick-host-stage
          key: ick-host-v1-${{ runner.os }}-${{ runner.arch }}-fbe86e23d55cfec2000c08e61deea2a407fd7175-${{ steps.qualified_ick_cache.outputs.runtime_key }}
      - name: Restore the exact frontend bootstrap
        id: frontend
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Build the checked frontend through ICK
        if: steps.frontend.outputs.cache-hit != 'true'
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Preserve the exact frontend before consumer checks
        if: steps.frontend.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Restore source metadata and install the compiler API
        run: .tools/runtime/.build/grease/bin/grease .tools/android-NDK/dex/idric/install-frontend.grease "$GITHUB_WORKSPACE/.tools/Idric"
      - name: Build the current direct DEX driver and independent decoders
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/formula-frontend/prepare.grease "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-oracles"
      - name: Retain the exact host compiler and driver for diagnostic replay
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/formula-frontend/retain-compiler.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/formula-compiler"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-formula-compiler-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/formula-compiler
          if-no-files-found: error
      - name: Compile and observe the actual Explorer Idric source
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/formula-frontend/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-evidence" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Compile and decode the actual scalar coefficient producer
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/coefficient-values/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-evidence/coefficient-values" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Compile original-order formula preparation and derivatives
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/semantic-preparation/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$RUNNER_TEMP/formula-evidence/semantic-preparation" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Compare semantic admission with the retained original jsurf
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/polynomial-qualification/reference.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/formula-evidence/original-jsurf"
      - name: Install the existing pinned SDK inputs for the original oracle
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Package only the retained original jsurf as a reference oracle
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/coefficient-values/prepare-oracle.grease "$RUNNER_TEMP/formula-evidence/original-jsurf" "$ANDROID_HOME" "$RUNNER_TEMP/formula-evidence/coefficient-values/original-oracle" "$RUNNER_TEMP/formula-oracles/baksmali.jar"
      - name: Assemble only the independent observation runner
        run: java -jar "$RUNNER_TEMP/formula-oracles/smali.jar" assemble examples/autogenerated/formula-frontend/FormulaRunner.smali examples/autogenerated/polynomial-qualification/PolynomialQualificationRunner.smali -o "$RUNNER_TEMP/formula-runner.dex"
      - name: Assemble the separate coefficient and original-oracle observers
        run: java -jar "$RUNNER_TEMP/formula-oracles/smali.jar" assemble examples/autogenerated/coefficient-values/CoefficientRunner.smali examples/autogenerated/coefficient-values/OriginalCoefficientOracle.smali -o "$RUNNER_TEMP/coefficient-runner.dex"
      - name: Assemble preparation observers without candidate semantics
        run: java -jar "$RUNNER_TEMP/formula-oracles/smali.jar" assemble examples/autogenerated/semantic-preparation/PreparationRunner.smali examples/autogenerated/semantic-preparation/OriginalPreparationOracle.smali -o "$RUNNER_TEMP/preparation-runner.dex"
      - name: Permit emulator hardware acceleration
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - name: Execute the actual parser, qualifier and coefficients on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1536 -gpu swiftshader_indirect
          script: |
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/formula-frontend/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence" "$RUNNER_TEMP/formula-runner.dex"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/coefficient-values/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/coefficient-values" "$RUNNER_TEMP/coefficient-runner.dex" "$RUNNER_TEMP/formula-evidence/coefficient-values/original-oracle/dex/classes.dex"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/semantic-preparation/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/formula-evidence/semantic-preparation" "$RUNNER_TEMP/preparation-runner.dex" "$RUNNER_TEMP/formula-evidence/coefficient-values/original-oracle/dex/classes.dex"
      - name: Retain source, diagnostics, exact DEX and actual observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-formula-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/formula-evidence
          if-no-files-found: warn
