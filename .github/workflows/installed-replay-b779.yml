name: Frozen b779 checked Activity with corrected Examples observer
on:
  pull_request:
    paths:
      - '.github/workflows/installed-replay-b779.yml'
      - 'examples/autogenerated/installed-replay-b779/**'
      - 'examples/autogenerated/pure-dex-apk/observer/**'
      - 'examples/autogenerated/pure-dex-apk/qualify-installed.grease'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-frozen-candidate:
    name: Diagnostic only - old APK current observer on API34
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact replay workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out only the frozen candidate's actual source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b779e912328fa52a5f5c6595b41b22608a590f68
          path: .replay/b779
          persist-credentials: false
      - name: Qualify the owned host compiler for the pinned Grease bootstrap
        id: replay_host_ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared Grease runtime with ICK
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.replay_host_ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the declared receipt scanner
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update; sudo apt-get install -y --no-install-recommends ripgrep'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1 ndk;29.0.14206865'
      - name: Load the exact old checked source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14207839986'
          merge-multiple: true
          run-id: 43829052041
          repository: isomorphismes/algebraic-variety-explorer-mobile
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/replay-checked-source
      - name: Load the exact old ARM64 production library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14208823177'
          merge-multiple: true
          run-id: 43829052041
          repository: isomorphismes/algebraic-variety-explorer-mobile
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/replay-native/arm64-v8a
      - name: Load the exact old ARM32 production library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14208009901'
          merge-multiple: true
          run-id: 43829052041
          repository: isomorphismes/algebraic-variety-explorer-mobile
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/replay-native/armeabi-v7a
      - name: Load the exact old emulator production library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14208654512'
          merge-multiple: true
          run-id: 43829052041
          repository: isomorphismes/algebraic-variety-explorer-mobile
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/replay-native/x86_64
      - name: Reconcile old bytes and repair only the observed packaging diagnostic
        run: |
          .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/installed-replay-b779/repackage.grease > "$RUNNER_TEMP/replay.syntax.txt"
          .tools/runtime/.build/grease/bin/grease examples/autogenerated/installed-replay-b779/repackage.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.replay/b779" "$GITHUB_WORKSPACE/.tools/runtime/.build/grease/bin/grease" "$ANDROID_HOME" "$ANDROID_HOME/ndk/29.0.14206865" "$RUNNER_TEMP/replay-checked-source" "$RUNNER_TEMP/replay-native" "$RUNNER_TEMP/installed-replay-b779"
      - name: Permit acceleration for the isolated emulator
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - name: Execute the current corrected observer against the frozen old candidate
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1536 -gpu swiftshader_indirect
          disable-animations: true
          script: .tools/runtime/.build/grease/bin/grease examples/autogenerated/pure-dex-apk/qualify-installed.grease "$GITHUB_WORKSPACE" "$ANDROID_HOME" "$ANDROID_HOME/platform-tools/adb" emulator-5554 34 "$RUNNER_TEMP/installed-replay-b779/unsigned" "$RUNNER_TEMP/installed-replay-b779/installed" "$RUNNER_TEMP/replay-checked-source/formula-evidence/oracles/smali.jar" "$RUNNER_TEMP/replay-checked-source/formula-evidence/oracles/baksmali.jar"
      - name: Retain the old-candidate provenance patch APK and installed observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-installed-replay-b779-current-observer-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/installed-replay-b779
            !${{ runner.temp }}/installed-replay-b779/**/*.p12
          include-hidden-files: true
          if-no-files-found: warn
