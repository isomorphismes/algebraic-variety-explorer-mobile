name: Real SURFER/jsurf movie - Madore E6

on:
  push:
    branches:
      - feature/madore-e6-orbit
    paths:
      - .github/workflows/madore-e6-movie.yml
      - JsurfPreview.test.java
      - JsurfCoreTest.test.java
      - SurfaceExamples.java
      - tools/render-madore-e6.sh
      - tools/verify-e6-render.py
      - notes/e6-madore-compare.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact SURFER source on feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Qualify the owned host compiler for the reference shell bootstrap
        id: reference_host_ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the pinned reference shell
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.reference_host_ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Expose the declared reference shell and source scanner
        run: .tools/runtime/.build/grease/bin/grease -c 'var workspace = ENV.GITHUB_WORKSPACE; var github_path = ENV.GITHUB_PATH; write -- "$workspace/.tools/runtime/.build/grease/bin" >> "$github_path"; sudo apt-get update; sudo apt-get install -y --no-install-recommends ripgrep'

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ffmpeg and ffprobe for movie encoding
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Validate scripts and keep existing sphere regression green
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/render-madore-e6.sh
          python3 -m py_compile tools/verify-e6-render.py
          command -v ffmpeg
          command -v ffprobe
          grease examples/autogenerated/original-jvm-reference/build.grease "$GITHUB_WORKSPACE" preview "$GITHUB_WORKSPACE/.build/original-sphere.ppm"
          ci/verify-preview.py .build/original-sphere.ppm

      - name: Render E6 with genuine jsurf and verify every decoded frame
        shell: bash
        run: bash tools/render-madore-e6.sh renders/madore-e6

      - name: Commit verified movie, GIF, still and checksums
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- renders/madore-e6/madore-e6-surfer.mp4 \
            renders/madore-e6/madore-e6-surfer.gif \
            renders/madore-e6/madore-e6-surfer.png \
            renders/madore-e6/madore-e6-surfer-manifest.json
          if git diff --cached --quiet; then
            echo "Verified E6 movie is already committed."
            exit 0
          fi
          git commit -m "Render and verify 32-frame SURFER film of Madore E6 cubic"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Retain original frame evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: madore-e6-jsurf-frame-evidence
          path: |
            renders/madore-e6/frames/
            renders/madore-e6/madore-e6-surfer.mp4
            renders/madore-e6/madore-e6-surfer.gif
            renders/madore-e6/madore-e6-surfer-manifest.json
          if-no-files-found: warn
          retention-days: 14
