name: Icky D SURFER

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icky-dmd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact SURFER source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Icky DMD bootstrap dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ldc openjdk-17-jdk-headless

      - name: Check out qualified Icky DMD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dilapidated-shed/ick
          ref: ccf61ab82659b9eadee2d05b489fb195956cef88
          path: .icky-dmd
          persist-credentials: false

      - name: Build Icky DMD
        shell: bash
        run: |
          set -euxo pipefail
          cd .icky-dmd/dmd/compiler/src
          ldmd2 -run ./build.d dmd HOST_DMD="$(command -v ldmd2)"
          dmd_bin=$(find ../../generated -type f -name dmd -perm -u+x -print -quit)
          test -n "$dmd_bin"
          dmd_bin=$(realpath "$dmd_bin")
          "$dmd_bin" --version
          printf '%s\n' "$dmd_bin" > "$GITHUB_WORKSPACE/.icky-dmd-bin"

      - name: Check out matching druntime source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dlang/dmd
          ref: 74917954b53f7f35b13e61b4438c7253834929ed
          path: .runtime-dmd
          persist-credentials: false

      - name: Check out matching Phobos source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dlang/phobos
          ref: 7b158eba80b97dfcdd8931bcaea1ad0ca35ceb95
          path: .runtime-phobos
          persist-credentials: false

      - name: Build matching druntime and Phobos with Icky DMD
        shell: bash
        run: |
          set -euxo pipefail
          dmd_bin=$(cat .icky-dmd-bin)
          mkdir -p .runtime-dmd/generated/linux/release/64
          cp "$dmd_bin" .runtime-dmd/generated/linux/release/64/dmd
          chmod +x .runtime-dmd/generated/linux/release/64/dmd
          runtime_dmd="$GITHUB_WORKSPACE/.runtime-dmd/generated/linux/release/64/dmd"

          make -C .runtime-dmd/druntime -j"$(nproc)" \
            MODEL=64 OS=linux BUILD=release SHARED=0 DMD="$runtime_dmd"
          make -C .runtime-phobos -j"$(nproc)" \
            MODEL=64 OS=linux BUILD=release SHARED=0 USE_IMPORTC=1 \
            DMD_DIR="$GITHUB_WORKSPACE/.runtime-dmd" DMD="$runtime_dmd"

          test -f .runtime-dmd/druntime/import/object.d
          test -f .runtime-phobos/generated/linux/release/64/libphobos2.a

      - name: Compile SURFER tests with Icky DMD and matching runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .build
          runtime_dmd="$GITHUB_WORKSPACE/.runtime-dmd/generated/linux/release/64/dmd"
          phobos="$GITHUB_WORKSPACE/.runtime-phobos/generated/linux/release/64/libphobos2.a"
          "$runtime_dmd" -conf= -fPIC -w \
            -I"$GITHUB_WORKSPACE/.runtime-dmd/druntime/import" \
            -I"$GITHUB_WORKSPACE/.runtime-phobos" \
            "$phobos" -defaultlib= -debuglib= -L-lpthread -L-lm -L-ldl \
            icky/surfer.d icky/surfer_test.d \
            -of=.build/surfer-icky-d
          test -x .build/surfer-icky-d

      - name: Run original Java parser and renderer tests
        shell: bash
        run: ./build.sh test

      - name: Run translated formula, renderer, and failure-fixture tests
        shell: bash
        run: .build/surfer-icky-d

      - name: Compare all shipped examples with the Java renderer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .build/icky-differential
          classpath=".build/test/classes:.dependencies/antlr-runtime-3.4.jar:.dependencies/vecmath-1.5.2.jar:.dependencies/junit-4.13.2.jar:.dependencies/hamcrest-core-1.3.jar"
          formulas=(
            'x^2+y^2+z^2-0.64'
            '(x^2+y^2+z^2+0.36)^2-1.69*(x^2+y^2)'
            'x^2+y^2+z^2+2*x*y*z-1'
            'x^2-y^2*z'
            'x^2*y^2+y^2*z^2+z^2*x^2-x*y*z'
            '(x^2+2.25*y^2+z^2-1)^3-x^2*z^3-0.1125*y^2*z^3'
          )
          patterns=('OG_1x1' 'QUINCUNX')
          for pattern in "${patterns[@]}"; do
            index=0
            for formula in "${formulas[@]}"; do
              reference=".build/icky-differential/$pattern-$index.ppm"
              java -Djsurf.preview.pattern="$pattern" \
                -Djsurf.preview.formula="$formula" \
                -Djsurf.preview.yaw=0.55 -Djsurf.preview.pitch=-0.35 \
                -Djsurf.preview.size=256 \
                -classpath "$classpath" \
                org.algebraicvarietyexplorer.render.JsurfPreview "$reference"
              .build/surfer-icky-d --compare-java-preview "$reference" "$formula" "$pattern"
              index=$((index + 1))
            done
          done
