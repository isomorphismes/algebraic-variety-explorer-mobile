name: SURFER editor touch diagnostic
on:
  pull_request:
    paths:
      - 'ci/native-editor-diagnostic.sh'
      - '.github/workflows/native-editor-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact diagnostic script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download previously compiled x86_64 native candidate (diagnostics only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: surfer-native-x86_64-18b04b7e2bee9fd14e0d7b72735fa282a61fb561
          run-id: 39596963599
          github-token: ${{ github.token }}
          path: native-artifacts

      - name: Install Java 17 to operate Android emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Permit emulator hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Reproduce EDIT tap and retain unfiltered system diagnostics
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: >-
            bash -c 'set -euo pipefail;
            apk="$(find native-artifacts -type f -name SURFER-native-probe-x86_64-debug.apk -print -quit)";
            test -s "$apk";
            bash ci/native-editor-diagnostic.sh "$apk" native-editor-diagnostic'

      - name: Retain screen, crash, process, navigation, and editor state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surfer-native-editor-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-editor-diagnostic/
          if-no-files-found: warn
          retention-days: 30
