name: Explorer C67 authorized release candidate (no APK publication)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Proposed GitHub release tag for later owner-approved publication
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  source-bound-producer:
    if: github.ref == 'refs/heads/surfer'
    uses: ./.github/workflows/native-android.yml

  sign-and-inspect:
    needs: source-bound-producer
    if: github.ref == 'refs/heads/surfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: explorer-c67-release-signing
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exactly the producer source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert default-branch release authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/surfer
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install Java 17 for pinned Android command-line tools
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK build-tools 35.0.1
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platforms;android-35 build-tools;35.0.1'
      - name: Fetch the exact in-run C67 unsigned signing input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: explorer-c67-unsigned-signing-input-${{ github.sha }}
          path: ${{ runner.temp }}/c67-unsigned

      - name: Qualify the pinned owned host compiler for Grease
        id: host_ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build pinned Grease through the qualified owned compiler
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.host_ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh

      - name: Sign only with the provisioned, persistent release identity
        shell: bash
        env:
          AVE_RELEASE_KEYSTORE_B64: ${{ secrets.AVE_RELEASE_KEYSTORE_B64 }}
          AVE_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AVE_RELEASE_KEYSTORE_PASSWORD }}
          AVE_RELEASE_KEY_PASSWORD: ${{ secrets.AVE_RELEASE_KEY_PASSWORD }}
          AVE_RELEASE_KEY_ALIAS: ${{ secrets.AVE_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          for name in AVE_RELEASE_KEYSTORE_B64 AVE_RELEASE_KEYSTORE_PASSWORD AVE_RELEASE_KEY_PASSWORD AVE_RELEASE_KEY_ALIAS; do
            test -n "${!name}" || { echo "missing authorized signing input $name" >&2; exit 1; }
          done
          shopt -s nullglob
          inputs=("$RUNNER_TEMP/c67-unsigned/"*-C67-unsigned.apk)
          (( ${#inputs[@]} == 1 )) || { echo 'not exactly one C67 producer APK' >&2; exit 1; }
          key_directory=$(mktemp -d "$RUNNER_TEMP/c67-keystore.XXXXXXXX")
          trap 'rm -rf -- "$key_directory"' EXIT
          printf '%s' "$AVE_RELEASE_KEYSTORE_B64" | base64 --decode > "$key_directory/authorized.p12"
          test -s "$key_directory/authorized.p12"
          mkdir -p "$RUNNER_TEMP/release"
          signed="$RUNNER_TEMP/release/Algebraic-Variety-Explorer-C67-$GITHUB_SHA.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign \
            --ks "$key_directory/authorized.p12" \
            --ks-key-alias "$AVE_RELEASE_KEY_ALIAS" \
            --ks-pass env:AVE_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:AVE_RELEASE_KEY_PASSWORD \
            --out "$signed" "${inputs[0]}"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$signed"
          ln -s "$ANDROID_HOME/build-tools/35.0.1" "$RUNNER_TEMP/c67-build-tools"

      - name: Independently verify the final APK against the release registry
        uses: isomorphisms/ai-ci/android-release-delivery@fcc9ea05c952c75605af5cd8cd23d0db6f31142b
        with:
          apk: ${{ runner.temp }}/release/Algebraic-Variety-Explorer-C67-${{ github.sha }}.apk
          expected-package: org.algebraicvarietyexplorer
          expected-abi: arm64-v8a
          target: c67
          grease: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
          build-tools: ${{ runner.temp }}/c67-build-tools
          receipt-output: ${{ runner.temp }}/release/aici-release-receipt.tsv

      - name: Bind the verified bytes back to the exact source producer
        shell: bash
        env:
          PROPOSED_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$PROPOSED_RELEASE_TAG" in
            ''|*[!a-zA-Z0-9_.-]*) echo 'invalid proposed tag' >&2; exit 1 ;;
          esac
          candidate="Algebraic-Variety-Explorer-C67-$GITHUB_SHA.apk"
          url="https://github.com/isomorphismes/algebraic-variety-explorer-mobile/releases/download/$PROPOSED_RELEASE_TAG/$candidate"
          bash ci/c67-release-record.sh \
            "$GITHUB_SHA" "$RUNNER_TEMP/c67-unsigned" \
            "$RUNNER_TEMP/release/$candidate" \
            "$RUNNER_TEMP/release/aici-release-receipt.tsv" \
            "$url" "$RUNNER_TEMP/release/catfood-candidate-row.tsv"

      # The signed APK and private credential never leave this ephemeral runner.
      # This receipt is only an index proposal, not proof of publication.
      - name: Retain only reviewable verification and index proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-c67-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/aici-release-receipt.tsv
            ${{ runner.temp }}/release/catfood-candidate-row.tsv
          if-no-files-found: error
          retention-days: 14
