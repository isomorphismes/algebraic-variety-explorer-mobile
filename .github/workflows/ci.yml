name: CI

on:
  push:
    branches:
      - surfer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checked-activity:
    name: Source-built Java-free application
    uses: ./.github/workflows/native-android.yml

  native-status-ick:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact native source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify the pinned ICK host compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared Grease bootstrap
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install declared evidence scanner
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update; sudo apt-get install -y --no-install-recommends ripgrep'
      - name: Expose the exact shell for nested reference acquisition
        run: .tools/runtime/.build/grease/bin/grease -c 'var workspace = ENV.GITHUB_WORKSPACE; var github_path = ENV.GITHUB_PATH; write -- "$workspace/.tools/runtime/.build/grease/bin" >> "$github_path"'
      - name: Execute native status, sanitizer and unchanged-success qualification
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/native-status/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ick-host-source" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/native-status-evidence"
      - name: Validate copied surface storage and worker borrow lifetimes
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/copied-prepared-surface/verify-host.grease "$GITHUB_WORKSPACE" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/copied-surface-evidence"
      - name: Validate copied rendered pixels and preserve prior output on failure
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/render-pixels/verify-host.grease "$GITHUB_WORKSPACE" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/render-pixels-evidence"
      - name: Install the original Java reference compiler
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source and release metadata
        run: ci/verify-metadata.sh
      - name: Prove source and preview verifiers fail closed
        run: ci/self-test.sh
      - name: Restore exact original-reference dependencies
        id: host_reference_dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ave-original-reference-jars-v1-${{ hashFiles('dependencies.lock') }}
          path: .dependencies
      - name: Acquire and verify the locked reference bytes before executing them
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/polynomial-qualification/prepare-dependencies.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/host-reference-dependencies"
      - name: Preserve verified reference dependencies before later test failures
        if: steps.host_reference_dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ave-original-reference-jars-v1-${{ hashFiles('dependencies.lock') }}
          path: .dependencies
      - name: Execute original JVM parser renderer and preview oracles
        run: |
          .tools/runtime/.build/grease/bin/grease -c '
            set -eu -o pipefail
            var workspace = ENV.GITHUB_WORKSPACE
            var temporary = ENV.RUNNER_TEMP
            setglobal ENV.PATH = ENV.GITHUB_WORKSPACE ++ "/.tools/runtime/.build/grease/bin:" ++ ENV.PATH
            grease "$workspace/examples/autogenerated/original-jvm-reference/build.grease" "$workspace" test
            cp -R "$workspace/.build/test" "$temporary/original-jvm-tests"
            grease "$workspace/examples/autogenerated/original-jvm-reference/build.grease" "$workspace" preview "$workspace/.build/ci-preview.ppm"
            "$workspace/ci/verify-preview.py" "$workspace/.build/ci-preview.ppm"
          '
      - name: Retain original JVM tests and preview as reference-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-original-jvm-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/original-jvm-tests
            .build/test
            .build/ci-preview.ppm
          if-no-files-found: warn
      - name: Acquire only the locked original-reference jars
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-adaptive-aa/prepare-reference.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aa-reference-jars"
      - name: Observe unchanged original sampling, blends and bounded pixels
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-adaptive-aa/reference.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aa-reference-jars" "$RUNNER_TEMP/aa-original-reference"
      - name: Qualify explicit AA colors, pixels, faults and targeted mutations
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-adaptive-aa/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ick-host-source" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/aa-original-reference" "$RUNNER_TEMP/aa-native-evidence"
      - name: Observe unchanged original transformed polynomials and gradient evaluation
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-specialization/reference.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aa-reference-jars" "$RUNNER_TEMP/specialization-original-reference"
      - name: Qualify nested XYZ row column bytes and cancelled private ownership
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-specialization/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ick-host-source" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/specialization-original-reference" "$RUNNER_TEMP/specialization-native-evidence"
      - name: Observe unchanged original orthographic camera matrices and ray spaces
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-camera/reference.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aa-reference-jars" "$RUNNER_TEMP/camera-original-reference"
      - name: Qualify original camera normalization inverse offsets and interpolation
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-camera/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ick-host-source" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/camera-original-reference" "$RUNNER_TEMP/camera-native-evidence"
      - name: Observe unchanged original lighting and default-lit image corpus
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-lighting/reference.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aa-reference-jars" "$RUNNER_TEMP/lighting-original-reference"
      - name: Qualify original lighting bytes full-canvas pixels and compiled mutations
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/original-lighting/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ick-host-source" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/lighting-original-reference" "$RUNNER_TEMP/lighting-native-evidence"
      - name: Qualify cooperative render sessions and transactional epoch publication
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/cooperative-render-session/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ick-host-source" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/render-session-evidence"
      - name: Retain exact native source and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surfer-native-status-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-status-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surfer-copied-surface-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/copied-surface-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surfer-original-aa-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/aa-reference-jars
            ${{ runner.temp }}/aa-original-reference
            ${{ runner.temp }}/aa-native-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surfer-original-specialization-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/specialization-original-reference
            ${{ runner.temp }}/specialization-native-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surfer-original-camera-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/camera-original-reference
            ${{ runner.temp }}/camera-native-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surfer-original-lighting-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/lighting-original-reference
            ${{ runner.temp }}/lighting-native-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surfer-render-session-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/render-session-evidence
          if-no-files-found: warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surfer-render-pixels-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/render-pixels-evidence
          if-no-files-found: warn
