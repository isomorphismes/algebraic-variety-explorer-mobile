name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ray-tracer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Run parser and ray-tracer tests
        run: bash build.sh test

      - name: Render JVM smoke-test image
        run: bash build.sh preview .build/ci-preview.ppm

      - name: Check smoke-test image
        run: test -s .build/ci-preview.ppm

  android-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Build unsigned release APK
        run: bash build.sh release

      - name: Check release APK
        run: test "$(find .build -maxdepth 1 -name '*unsigned.apk' -size +0c | wc -l)" -ge 1
