name: Idris shader dogfood

on:
  push:
    paths:
      - '.github/workflows/idris-shader-dogfood.yml'
      - 'ci/check-idris-shader-dogfood.sh'
  pull_request:
    paths:
      - '.github/workflows/idris-shader-dogfood.yml'
      - 'ci/check-idris-shader-dogfood.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idris-shader-dogfood-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IDRIS2_VERSION: 0.8.0
  # Exact green head of idris-shader-backend PR #11.
  SHADER_BACKEND_REVISION: 66214e3da0443fe4887062549e9ef5810c586dd7

jobs:
  algebraic-surface-f16-f32:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out exact Algebraic Variety Explorer source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Idris and GLSL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes chezscheme glslang-tools libgmp-dev

      - name: Restore Idris 2 compiler and API
        id: idris-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.idris2
          key: ave-idris2-${{ runner.os }}-${{ runner.arch }}-${{ env.IDRIS2_VERSION }}-compiler-api-v1

      - name: Build self-hosted Idris 2 and compiler API
        if: steps.idris-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${IDRIS2_VERSION}" \
            https://github.com/idris-lang/Idris2.git "$RUNNER_TEMP/Idris2"
          make -C "$RUNNER_TEMP/Idris2" bootstrap SCHEME=chezscheme
          make -C "$RUNNER_TEMP/Idris2" install
          export PATH="$HOME/.idris2/bin:$PATH"
          make -C "$RUNNER_TEMP/Idris2" clean
          make -C "$RUNNER_TEMP/Idris2" all
          make -C "$RUNNER_TEMP/Idris2" install
          make -C "$RUNNER_TEMP/Idris2" install-api

      - name: Put Idris 2 on PATH
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Fetch exact shader backend revision
        run: |
          backend="$RUNNER_TEMP/idris-shader-backend"
          git init "$backend"
          git -C "$backend" remote add origin https://github.com/isomorphisms/idris-shader-backend.git
          git -C "$backend" fetch --depth 1 origin "$SHADER_BACKEND_REVISION"
          git -C "$backend" checkout --detach FETCH_HEAD
          test "$(git -C "$backend" rev-parse HEAD)" = "$SHADER_BACKEND_REVISION"

      - name: Compile algebraic-surface root search as F16 and F32
        run: |
          bash ci/check-idris-shader-dogfood.sh \
            "$RUNNER_TEMP/idris-shader-backend" \
            "$RUNNER_TEMP/algebraic-surface-shader-evidence"

      - name: Retain checked IR and generated GLSL evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: algebraic-surface-idris-shader-dogfood
          path: ${{ runner.temp }}/algebraic-surface-shader-evidence/
          if-no-files-found: error
          retention-days: 14
