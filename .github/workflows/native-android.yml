name: Explorer native libraries and checked Activity

on:
  pull_request:
    paths:
      - 'native/**'
      - 'c-lua/idric/**'
      - 'examples/autogenerated/normal-activity-port/**'
      - 'examples/autogenerated/pure-dex-apk/**'
      - 'layout.activity_idric.xml'
      - 'values.idric_examples.xml'
      - '.github/workflows/idric-formula.yml'
      - 'examples/autogenerated/render-pixels/cross-build.grease'
      - 'ci/build-toolchain.tsv'
      - 'ci/verify-native-toolchain.sh'
      - 'ci/verify-native-screenshots.py'
      - 'ci/native-emulator-smoke.sh'
      - 'ci/compare-java-native-surfer.py'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-activity-source:
    uses: ./.github/workflows/idric-formula.yml

  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            gnu: aarch64-linux-gnu
            binutils: binutils-aarch64-linux-gnu
          - abi: armeabi-v7a
            gnu: arm-linux-gnueabi
            binutils: binutils-arm-linux-gnueabi
          - abi: x86_64
            gnu: x86_64-linux-gnu
            binutils: binutils-x86-64-linux-gnu

    steps:
      - name: Check out exact SURFER source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify declared compiler choices and kill one fallback mutant
        shell: bash
        run: |
          set -euo pipefail
          ci/verify-native-toolchain.sh
          sed $'s/\\tick\\t/\\tndk\\t/' ci/build-toolchain.tsv > /tmp/native-bad-toolchain.tsv
          if ci/verify-native-toolchain.sh /tmp/native-bad-toolchain.tsv; then
            echo 'invalid ICK-to-NDK compilation fallback passed' >&2
            exit 1
          fi

      - name: Fail-closed native expression semantics under host sanitizers
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -Wall -Wextra -Werror -pedantic \
            -O1 -g -fno-fast-math -ffp-contract=off \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/android/formula.c native/android/presets.c \
            native/android/formula_test.c \
            -lm -o /tmp/surfer-formula-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/surfer-formula-test

      - name: Check out pinned ICK and owned GCC reference
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dilapidated-shed/ick
          ref: c61e448251744a2f40ad743ebef1a027bdcd2f9d
          submodules: true
          path: .compiler/ick
          persist-credentials: false

      - name: Verify and materialize source-built ICK
        shell: bash
        run: |
          set -euo pipefail
          cd .compiler/ick
          test "$(git rev-parse HEAD)" = c61e448251744a2f40ad743ebef1a027bdcd2f9d
          . ick/SOURCE.lock
          test "$(git -C gcc rev-parse HEAD)" = "$gcc_commit"
          bash ick/materialize.sh gcc source
          test -s source/gcc/config/linux-android.h

      - name: Install ICK compiler-bootstrap prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev \
            ${{ matrix.binutils }}

      - name: Build the owned ICK cross C compiler
        shell: bash
        run: |
          set -euo pipefail
          cd .compiler/ick
          mkdir -p build stage
          cd build
          ../source/configure \
            --target=${{ matrix.gnu }} \
            --prefix="$GITHUB_WORKSPACE/.compiler/ick/stage" \
            --with-as="$(command -v ${{ matrix.gnu }}-as)" \
            --with-ld="$(command -v ${{ matrix.gnu }}-ld)" \
            --enable-languages=c \
            --disable-bootstrap --disable-multilib --disable-nls \
            --disable-shared --disable-threads --without-headers \
            --disable-libatomic --disable-libgomp --disable-libquadmath \
            --disable-libssp --disable-libvtv
          make -j2 all-gcc
          make install-gcc
          "$GITHUB_WORKSPACE/.compiler/ick/stage/bin/${{ matrix.gnu }}-gcc" --version

      - name: Provision Java 17 for Android command-line packaging
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK tools without obsolete tools package
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''

      - name: Install exact Android SDK and NDK versions
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.1' \
            'ndk;29.0.14206865'

      - name: ICK compile plus NDK platform link, unsigned/signed APK checks
        shell: bash
        env:
          ICK_SOURCE_DIR: ${{ github.workspace }}/.compiler/ick
          ICK: ${{ github.workspace }}/.compiler/ick/stage/bin/${{ matrix.gnu }}-gcc
        run: |
          set -euo pipefail
          native/android/build-native.sh ${{ matrix.abi }}
          cat ".build/native/${{ matrix.abi }}/provenance.txt"
          test -s ".build/native/${{ matrix.abi }}/elf-header.txt"
          ! grep -Eq '^classes[0-9]*\.dex$' ".build/native/${{ matrix.abi }}/entries.txt"

      - name: Qualify owned host compiler for the declared Grease bootstrap
        id: render_host_ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the pinned Grease runtime with the owned host compiler
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.render_host_ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the declared native cross-build evidence scanner
        # The source/evidence scanner is a declared host prerequisite.
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update; sudo apt-get install -y --no-install-recommends ripgrep'
      - name: Compile and inspect the exact native render sources for this ABI
        shell: sh
        run: |
          .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/render-pixels/cross-build.grease > "$RUNNER_TEMP/render-cross.syntax.txt"
          .tools/runtime/.build/grease/bin/grease examples/autogenerated/render-pixels/cross-build.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.compiler/ick" "$GITHUB_WORKSPACE/.compiler/ick/stage/bin/${{ matrix.gnu }}-gcc" "${{ matrix.abi }}" "$ANDROID_HOME/ndk/29.0.14206865" "$GITHUB_WORKSPACE/.build/native/${{ matrix.abi }}/prepared-render-api23"
      - name: Retain actual APK, ABI evidence, and source/object hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surfer-native-${{ matrix.abi }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .build/native/${{ matrix.abi }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  package-checked-activity:
    name: Pure DEX APK and installed Activity
    needs: [build-native, checked-activity-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify the owned host compiler for the pinned Grease bootstrap
        id: package_host_ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the declared Grease runtime with ICK
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.package_host_ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Install the declared source and receipt scanner
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo apt-get update; sudo apt-get install -y --no-install-recommends ripgrep'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1 ndk;29.0.14206865'
      - name: Load exact checked source and DEX from this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: explorer-formula-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/checked-source
      - name: Load exact ARM64 production library and receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: surfer-native-arm64-v8a-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-download/arm64-v8a
      - name: Load exact ARM32 production library and receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: surfer-native-armeabi-v7a-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-download/armeabi-v7a
      - name: Load exact emulator production library and receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: surfer-native-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-download/x86_64
      - name: Stage the declared production profiles without changing their receipts
        run: |
          .tools/runtime/.build/grease/bin/grease -c '
            mkdir -p "$RUNNER_TEMP/native-input"
            for abi in arm64-v8a armeabi-v7a x86_64 {
              cp -R "$RUNNER_TEMP/native-download/$abi/prepared-render-api23" "$RUNNER_TEMP/native-input/$abi"
            }
          '
      - name: Package only checked DEX original resources and actual production libraries
        run: |
          .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/pure-dex-apk/package.grease > "$RUNNER_TEMP/package.syntax.txt"
          .tools/runtime/.build/grease/bin/grease -n examples/autogenerated/pure-dex-apk/qualify-installed.grease > "$RUNNER_TEMP/installed.syntax.txt"
          .tools/runtime/.build/grease/bin/grease examples/autogenerated/pure-dex-apk/package.grease "$GITHUB_WORKSPACE" "$ANDROID_HOME" "$ANDROID_HOME/ndk/29.0.14206865" "$RUNNER_TEMP/checked-source/normal-activity" "$RUNNER_TEMP/native-input" "$RUNNER_TEMP/checked-activity-apk"
      - name: Permit acceleration for the isolated emulator
        run: .tools/runtime/.build/grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - name: Observe installed Activity pixels editing actions cancellation and recreation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1536 -gpu swiftshader_indirect
          disable-animations: true
          script: .tools/runtime/.build/grease/bin/grease examples/autogenerated/pure-dex-apk/qualify-installed.grease "$GITHUB_WORKSPACE" "$ANDROID_HOME" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/checked-activity-apk" "$RUNNER_TEMP/installed-activity" "$RUNNER_TEMP/checked-source/oracles/smali.jar" "$RUNNER_TEMP/checked-source/oracles/baksmali.jar"
      - name: Retain the unsigned candidate exact bytes and installed observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explorer-pure-dex-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/checked-activity-apk
            ${{ runner.temp }}/installed-activity
          if-no-files-found: warn

  native-emulator-smoke:
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact head with screen comparison
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify positive and negative screenshot controls
        run: python3 ci/verify-native-screenshots.py --self-test

      - name: Load exactly the ICK-compiled x86_64 APK from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: surfer-native-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-artifacts

      - name: Install Java 17 to operate Android emulator tooling
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Permit emulator hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and render on Android API 35 x86_64
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: >-
            bash -c 'set -euo pipefail; mapfile -t apks < <(find native-artifacts -type f -name "SURFER-native-probe-x86_64-debug.apk" -print); test "${#apks[@]}" -eq 1; exec bash ci/native-emulator-smoke.sh "${apks[0]}" native-evidence'

      - name: Require bounded Java/jsurf versus executed native images for all seven formulas
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh test
          python3 ci/compare-java-native-surfer.py native-evidence \
            | tee native-evidence/java-native-parity.jsonl

      - name: Retain executed APK hash, live logs, and decoded screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surfer-native-emulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 30
